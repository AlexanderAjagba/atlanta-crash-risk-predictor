spring:
  config:
    import: optional:file:.env.local[.properties]
  application:
    name: backend
  ai:
    model:
      chat: google-genai
    google:
      genai:
        api-key: ${GOOGLE_API_KEY}
        chat:
          model: gemini-2.5-flash-lite
          temperature: 0.2

inference:
  url: ${INFERENCE_URL:http://127.0.0.1:8001}
